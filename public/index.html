<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Voice Khata</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; background: #fff; color: #111; font: 18px/1.4 system-ui, "Noto Sans Devanagari", "Noto Sans", sans-serif; }
  main { max-width: 480px; margin: 0 auto; padding: 12px 14px 32px; }
  h1 { margin: 4px 0 0; font-size: 26px; }
  .sub { margin: 0; color: #444; font-size: 15px; }
  #status { margin: 12px 0 8px; padding: 10px 12px; border-radius: 10px; background: #eee; font-weight: 700; min-height: 46px; }
  #status.listen { background: #ffd9d9; color: #8a0000; }
  #status.think { background: #fff0b8; color: #5a4400; }
  #status.speak { background: #d6f0d6; color: #0b4a0b; }
  #status.warn, #status.err { background: #ffe0b8; color: #6a2f00; }
  .box { margin: 6px 0; padding: 8px 12px; border: 2px solid #ccc; border-radius: 10px; min-height: 52px; }
  .box small { display: block; color: #555; font-size: 13px; }
  .box span { font-size: 19px; word-break: break-word; }
  #badge { display: inline-block; margin: 8px 0; padding: 4px 12px; border-radius: 999px; background: #111; color: #fff; font-size: 16px; font-variant-numeric: tabular-nums; }
  .center { text-align: center; }
  #talk { width: 168px; height: 168px; border-radius: 50%; border: 0; margin: 10px 0 14px; background: #0a58d6; color: #fff; font-weight: 700; font-size: 22px; line-height: 1.2; font-family: inherit;
    touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
    box-shadow: 0 6px 0 #063a8f; }
  #talk.on { background: #d40000; box-shadow: 0 2px 0 #7a0000; transform: translateY(4px); }
  #ledger { margin: 8px 0; padding: 0; list-style: none; }
  #ledger > li { border: 2px solid #ccc; border-radius: 10px; margin: 8px 0; overflow: hidden; }
  .row { display: flex; justify-content: space-between; align-items: center; width: 100%; min-height: 56px; padding: 8px 12px; background: #fff; border: 0; font: inherit; color: inherit; text-align: left; }
  .row b { font-size: 20px; font-variant-numeric: tabular-nums; }
  .entries { padding: 0 12px 8px; background: #f6f6f6; }
  .entries div { display: flex; justify-content: space-between; gap: 8px; padding: 6px 0; border-top: 1px solid #ddd; font-size: 16px; font-variant-numeric: tabular-nums; }
  .cr { color: #9a0000; }
  .pm { color: #0b5a0b; }
  .link { background: none; border: 0; padding: 10px 4px; font-size: 15px; font-family: inherit; color: #0a3fa0; text-decoration: underline; cursor: pointer; min-height: 44px; }
  #picker { position: fixed; inset: 0; background: #fff; z-index: 10; overflow: auto; padding: 16px 14px; }
  #picker h2 { margin: 4px 0 12px; font-size: 22px; text-align: center; }
  #langs { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; max-width: 480px; margin: 0 auto; }
  #langs button { min-height: 72px; font-weight: 700; font-size: 22px; font-family: inherit; border: 2px solid #0a58d6; border-radius: 12px; background: #fff; color: #0a3fa0; }
  #langs button:active { background: #dbe8ff; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <h1>Voice Khata</h1>
  <p class="sub">AI सहायक</p>

  <div id="status" role="status" aria-live="polite">...</div>

  <div class="box"><small>सुना</small><span id="heard">-</span></div>
  <div class="box"><small>जवाब</small><span id="reply">-</span></div>

  <div class="center">
    <div id="badge" title="पहली आवाज़ तक का समय">-- s</div>
    <div><button id="talk" type="button">दबाकर बोलें</button></div>
  </div>

  <ul id="ledger"></ul>

  <div class="center">
    <button id="langbtn" class="link" type="button">भाषा बदलें</button>
    <button id="reset" class="link" type="button">डेमो डेटा रीसेट</button>
  </div>
</main>

<div id="picker" hidden>
  <h2>अपनी भाषा चुनें<br><span style="font-size:16px;font-weight:400">Choose your language</span></h2>
  <div id="langs"></div>
</div>

<script type="module" src="app.js"></script>
</body>
</html>
