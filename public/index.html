<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<link rel="icon" href="data:,">
<title>Voice Khata</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <header class="top">
    <h1>Voice Khata</h1>
    <span class="pill">AI सहायक</span>
    <button id="langbtn" class="chip" type="button">भाषा बदलें</button>
  </header>

  <nav class="modes" role="tablist" aria-label="मोड चुनें">
    <button id="modeKhata" class="mode" type="button" role="tab" aria-selected="true">दुकान खाता</button>
    <button id="modeKharcha" class="mode" type="button" role="tab" aria-selected="false">घर का खर्चा</button>
  </nav>

  <div class="page">
    <section id="summary">
      <div class="tile"><span>कुल बाकी</span><b id="sumDue">₹0</b></div>
      <div class="tile"><span>आज उधार</span><b id="sumToday">₹0</b></div>
      <div class="tile"><span>ग्राहक</span><b id="sumCount">0</b></div>
    </section>

    <div id="status" role="status" aria-live="polite">...</div>

    <div id="thread"></div>

    <h2 class="section" id="ledgerTitle">खाता</h2>
    <div id="catBar" hidden></div>
    <ul id="ledger"></ul>

    <footer class="foot">
      <p class="sheet" id="sheetBox" hidden><label><input type="checkbox" id="sheetOn"> डेमो शीट में भी लिखें (ये शीट सब देख सकते हैं)</label> <a id="sheetLink" target="_blank" rel="noopener">शीट देखें</a> <span id="sheetMsg"></span></p>
      <button id="reset" class="link" type="button">डेमो डेटा रीसेट</button>
    </footer>
  </div>
</main>

<div class="composer">
  <div class="cmp-row">
    <input id="textIn" type="text" maxlength="300" autocomplete="off" enterkeyhint="send" placeholder="लिखें या बोलें... जैसे: चाय 20, ऑटो 50">
    <button id="send" class="send" type="button" aria-label="भेजें">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M2 21l21-9L2 3v7l15 2-15 2z"/></svg>
    </button>
    <div class="mic-wrap">
      <div id="timer">0:00</div>
      <button id="talk" type="button" aria-label="दबाकर बोलें">
        <svg viewBox="0 0 24 24" width="28" height="28" aria-hidden="true"><path fill="currentColor" d="M12 15a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-2.08A7 7 0 0 0 19 12h-2z"/></svg>
      </button>
    </div>
  </div>
  <div id="hint">दबाकर रखें, बोलें, छोड़ें</div>
</div>

<div id="toast" role="status"></div>

<div id="picker" hidden>
  <h2>अपनी भाषा चुनें<br><span>Choose your language</span></h2>
  <div id="langs"></div>
</div>

<script type="module" src="app.js"></script>
</body>
</html>
